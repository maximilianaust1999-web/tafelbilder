button{font:inherit;color:inherit}
.wrap{max-width:min(1100px,92vw);margin:0 auto;padding:34px 0 0}
.titel{position:relative;transform:rotate(-1deg);filter:drop-shadow(2px 6px 5px rgba(40,30,15,.32));margin-top:14px}
.titel .karo{background-color:#FFFDF7;background-image:linear-gradient(#BFE0DA 1px,transparent 1px),linear-gradient(90deg,#BFE0DA 1px,transparent 1px);
  background-size:20px 20px;clip-path:polygon(0% 0%,100% 0%,100.00% 99.43%,98.00% 99.75%,96.00% 99.05%,94.00% 99.63%,92.00% 99.84%,90.00% 99.04%,88.00% 97.80%,86.00% 98.08%,84.00% 98.16%,82.00% 99.47%,80.00% 98.71%,78.00% 99.34%,76.00% 99.59%,74.00% 99.75%,72.00% 99.49%,70.00% 97.77%,68.00% 98.01%,66.00% 98.06%,64.00% 98.08%,62.00% 99.54%,60.00% 99.26%,58.00% 98.50%,56.00% 98.24%,54.00% 97.95%,52.00% 97.89%,50.00% 99.79%,48.00% 98.55%,46.00% 98.39%,44.00% 98.79%,42.00% 99.57%,40.00% 98.86%,38.00% 99.79%,36.00% 97.76%,34.00% 97.92%,32.00% 98.69%,30.00% 99.28%,28.00% 97.82%,26.00% 98.63%,24.00% 97.88%,22.00% 97.96%,20.00% 98.78%,18.00% 99.01%,16.00% 98.56%,14.00% 98.97%,12.00% 99.61%,10.00% 99.27%,8.00% 98.05%,6.00% 99.90%,4.00% 99.89%,2.00% 98.50%,0.00% 99.33%);padding:42px 160px 36px 34px}
.titel h1{font-family:'Lilita One',Arial,sans-serif;font-weight:400;font-size:clamp(30px,4.2vw,58px);line-height:.95;margin:0;text-shadow:4px 4px 0 var(--akz)}
.titel .u{font-family:'Gochi Hand',cursive;font-size:clamp(20px,2.2vw,30px);margin-top:10px}
.tape{position:absolute;left:22px;top:-18px;transform:rotate(-3deg);z-index:2;display:inline-block;background:#9EDFD4;
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 6px,transparent 6px 12px);clip-path:polygon(0.8% 0.0%,1.9% 14.3%,1.3% 28.6%,2.1% 42.9%,2.2% 57.1%,0.2% 71.4%,0.0% 85.7%,2.9% 100.0%,99.1% 100.0%,99.2% 85.7%,96.5% 71.4%,98.4% 57.1%,97.1% 42.9%,98.3% 28.6%,97.8% 14.3%,99.5% 0.0%);
  padding:6px 26px 4px;font-family:'Gochi Hand',cursive;font-size:22px;line-height:1.05;white-space:nowrap}
.stempel{position:absolute;right:14px;top:-22px;width:118px;transform:rotate(8deg);z-index:2;filter:drop-shadow(1px 3px 3px rgba(40,30,15,.35))}
.fenster{position:absolute;left:0;right:0;top:0;height:34px;background:#1F5FA8;display:flex;justify-content:space-between;align-items:center;
  padding:0 160px 0 16px;color:#fff;font-weight:800;letter-spacing:4px;z-index:1}
.fenster i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}
.fenster~.tape{top:22px}.fenster~.karo{padding-top:66px}
.karte{background:#fff;margin-top:26px;padding:26px 28px;box-shadow:2px 6px 14px rgba(40,30,15,.25);transform:rotate(.3deg)}
.kopf{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.bar{flex:1;height:16px;background:#EEE8DE;position:relative;clip-path:polygon(0.8% 0.0%,1.9% 14.3%,1.3% 28.6%,2.1% 42.9%,2.2% 57.1%,0.2% 71.4%,0.0% 85.7%,2.9% 100.0%,99.1% 100.0%,99.2% 85.7%,96.5% 71.4%,98.4% 57.1%,97.1% 42.9%,98.3% 28.6%,97.8% 14.3%,99.5% 0.0%)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--akz);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px);transition:width .3s}
#n{font-family:'Gochi Hand',cursive;font-size:clamp(22px,2vw,28px);white-space:nowrap}
.q{font-family:'Lilita One',Arial,sans-serif;font-size:clamp(24px,3vw,42px);line-height:1.12;margin:4px 0 18px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font-size:clamp(19px,2.1vw,30px);font-weight:600;padding:12px 16px;
  background:#FFFDF7;border:2px solid #E3DDD3;border-radius:3px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--akz);outline:none}
.opt .l{flex:none;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;font-family:'Lilita One',Arial,sans-serif;font-weight:400;
  background:var(--akz);color:#fff;border-radius:3px}
.opt.ok{background:#E3F4EA;border-color:#2E8B57}.opt.ok .l{background:#2E8B57}
.opt.no{background:#FBE6E3;border-color:#C62828}.opt.no .l{background:#C62828}
.opt.aus{opacity:.55}
.fb{min-height:34px;margin-top:16px;font-size:clamp(19px,1.9vw,27px);line-height:1.3}
.fb b{font-family:'Lilita One',Arial,sans-serif;font-weight:400;font-size:1.15em;margin-right:6px}.fb.ok b{color:#2E8B57}.fb.no b{color:#C62828}
.nx:focus-visible{outline:3px solid var(--akz);outline-offset:3px}
.nx{margin-top:16px;font-family:'Lilita One',Arial,sans-serif;font-size:clamp(22px,2vw,28px);padding:12px 30px 10px;border:0;background:#0F2B28;color:#fff;cursor:pointer;border-radius:4px}
.end{text-align:center;padding:10px 0}.end .big{font-family:'Lilita One',Arial,sans-serif;font-size:clamp(70px,8vw,120px);line-height:1;text-shadow:5px 5px 0 var(--akz)}
.end p{font-family:'Gochi Hand',cursive;font-size:clamp(28px,2.6vw,38px);margin:14px 0 4px}
.fuss{display:flex;justify-content:space-between;align-items:center;max-width:min(1100px,92vw);margin:18px auto 26px;font-size:14px;color:#0F2B28;opacity:.85}
.fuss .wm{font-family:'Lilita One',Arial,sans-serif;font-size:20px}.fuss .wm i{color:#FF8A5B;font-style:normal}
@media(max-width:640px){.wrap{max-width:none;padding:30px 14px 0}.fuss{padding:0 14px}.titel .karo{padding:36px 20px 26px}.fenster~.karo{padding-top:58px}
  .stempel{width:64px;top:-30px;right:-4px}.fenster{padding-right:70px}.tape{font-size:18px}.karte{padding:20px 16px}}
@media(max-height:860px) and (min-width:641px){.wrap{padding-top:20px}.titel .karo{padding:26px 150px 18px 30px}.fenster~.karo{padding-top:58px}.fenster~.tape{top:14px}
  .titel h1{font-size:38px}.titel .u{font-size:22px;margin-top:4px}.stempel{width:92px}.karte{margin-top:16px;padding:16px 24px}.kopf{margin-bottom:8px}
  .q{font-size:28px;margin:0 0 10px}.opts{gap:8px}.opt{padding:7px 14px;font-size:21px}.fb{margin-top:10px}.nx{margin-top:10px;padding:9px 26px 7px}.fuss{margin:10px auto 14px}}
@media print{body{background:#fff}}

.wrap{max-width:min(1250px,96vw)!important}
.karte{transform:none!important;padding:18px 20px 22px!important}
.zeile{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.knopf{font-family:'Lilita One',Arial,sans-serif;font-size:clamp(18px,1.6vw,24px);padding:10px 18px 8px;border:0;border-radius:6px;background:#1A1E2B;color:#fff;cursor:pointer}
.knopf.hell{background:#fff;color:#1A1E2B;border:2px solid #1A1E2B}
.knopf.akz{background:var(--akz)}
.knopf:focus-visible{outline:3px solid var(--akz);outline-offset:3px}
.fb{font-size:clamp(20px,1.9vw,27px);min-height:34px;font-weight:700;margin:8px 0}.fb.ok{color:#2E8B57}.fb.no{color:#C62828}
.code{text-align:center;padding:8px 0}.code .big{font-family:'Lilita One',Arial,sans-serif;font-size:clamp(44px,5vw,72px);line-height:1;text-shadow:4px 4px 0 var(--akz);letter-spacing:2px}
.code p{font-family:'Gochi Hand',cursive;font-size:clamp(24px,2.2vw,32px);margin:6px 0}

.planer{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media(max-width:900px){.planer{grid-template-columns:1fr}}
#brett{display:grid;gap:2px;background:#E3DDD3;padding:8px;border-radius:8px;touch-action:none;user-select:none;width:560px;max-width:100%;box-sizing:border-box;aspect-ratio:1}   /* 19.10.2026: min(560px,100%) fiel in der auto-Spalte auf 0 px zusammen */
#brett div{background:#FFFDF7;border-radius:50%;position:relative;cursor:pointer;box-shadow:inset 0 0 0 1px #D5CEC2}
#brett div::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#FFFDF7;opacity:.0}
#brett div.p::after{opacity:.85;background:#fff}
#brett div.p{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
#brett div.p.w{box-shadow:inset 0 0 0 2.5px #6B6458}
#brett div.allein{outline:3px solid #C62828;outline-offset:-1px;animation:blink 1s infinite}
@keyframes blink{50%{outline-color:transparent}}
.farben{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 12px}
.farben button{height:54px;border-radius:50%;border:3px solid #E3DDD3;cursor:pointer;aspect-ratio:1;justify-self:center}
.farben button.an{border-color:#1A1E2B;transform:scale(1.12);box-shadow:0 0 0 3px var(--akz)}
.farben button.gummi{border-radius:10px;background:#fff;font-size:26px;width:100%}
.zaehl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-weight:700;font-size:18px}
.zaehl span{display:flex;align-items:center;gap:6px;background:#FFFDF7;border:2px solid #E3DDD3;border-radius:16px;padding:3px 10px}
.zaehl i{display:inline-block;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.ideen{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ideen button{background:#FFFDF7;border:2px solid #E3DDD3;border-radius:8px;padding:4px;cursor:pointer;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px}
.ideen button canvas{width:60px;height:60px}
.hl{font-family:'Lilita One',Arial,sans-serif;font-size:22px;margin:4px 0 2px}
#druck{display:none}
@media print{
 body{background:#fff!important}.wrap,.fuss{display:none!important}#druck{display:block!important;font-family:Arial,sans-serif;color:#222}
 #druck h2{font-size:20pt;margin:0 0 4mm}#druck .dk{display:grid;gap:0;margin:0 auto 5mm}
 #druck .dk div{border:.25mm solid #bbb;display:flex;align-items:center;justify-content:center;font-size:9pt;border-radius:50%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #druck table{border-collapse:collapse;font-size:12pt}#druck td{border:.3mm solid #999;padding:1.5mm 4mm}
 #druck .sw{display:inline-block;width:5mm;height:5mm;border-radius:50%;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact;border:.2mm solid #555}
 @page{size:A4;margin:12mm}}

<script>
const D={"n": 15, "farben": [["O", "Orange", "#F08A1C", "▲"], ["K", "Schwarz", "#222222", "■"], ["W", "Weiß", "#FFFFFF", "○"], ["Y", "Gelb", "#F2C61F", "◆"], ["G", "Grün", "#3E9B4F", "★"], ["V", "Lila", "#7B4FB3", "✚"], ["R", "Rot", "#D64545", "●"], ["L", "Hellblau", "#8CC7EE", "▼"], ["P", "Rosa", "#F4A6B8", "♥"], ["B", "Braun", "#8A5A33", "✖"]], "ideen": {"Herz": {"rows": [".RR.RR.", "RRRRRRR", "RRRRRRR", ".RRRRR.", "..RRR..", "...R..."]}, "Geist": {"rows": ["...LLLL...", "..LLLLLL..", ".LLLLLLLL.", ".LLKLLKLL.", ".LLKLLKLL.", ".LPLLLLPL.", ".LLLKKLLL.", ".LLLLLLLL.", ".LLLLLLLL.", ".LL.LL.LL."]}, "Herbstblatt": {"rows": ["....O....", "...OOO...", "..OOOOO..", ".OOOROOO.", "OOOOROOOO", ".OOOROOO.", "..OOROO..", "...ORO...", "....B....", "....B...."]}, "Laterne": {"rows": ["...KKK...", "...K.K...", "...K.K...", "..KKKKK..", "..YYYYY..", "..YRYRY..", "..YYYYY..", "..RYRYR..", "..YYYYY..", "..KKKKK.."]}}, "maxf": 4, "min": 20, "code": "ENTWURF"};const N=D.n,FARB=D.farben,F={};FARB.forEach(f=>F[f[0]]=f);
let gitter=Array(N*N).fill('.'),wahl=FARB[0][0],malt=false,geprueft=false,codeDa=false;
const $=s=>document.querySelector(s),brett=$('#brett');
brett.style.gridTemplateColumns=`repeat(${N},1fr)`;
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.dataset.i=i;brett.appendChild(d)}
function setze(i){gitter[i]=wahl=='.'?'.':wahl;zeichne()}
function zeichne(){const zellen=brett.children,allein=pruefen().allein;
 for(let i=0;i<N*N;i++){const c=gitter[i],z=zellen[i];z.style.background=c=='.'?'#FFFDF7':F[c][2];z.classList.toggle('p',c!='.');z.classList.toggle('w',c=='W');z.classList.toggle('allein',geprueft&&allein.has(i))}
 const n={};gitter.forEach(c=>{if(c!='.')n[c]=(n[c]||0)+1});
 $('#zaehl').innerHTML=Object.keys(n).length?Object.entries(n).map(([c,k])=>`<span><i style="background:${F[c][2]}"></i>${F[c][1]}: ${k}</span>`).join('')+`<span>Zusammen: ${Object.values(n).reduce((a,b)=>a+b,0)}</span>`:'<span>Noch keine Perle. Wähle eine Farbe und tippe auf die Platte.</span>'}
function pruefen(){const allein=new Set();let n=0;const farben=new Set();
 for(let i=0;i<N*N;i++){if(gitter[i]=='.')continue;n++;farben.add(gitter[i]);const x=i%N,y=Math.floor(i/N);
  const nb=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const a=x+dx,b=y+dy;return a>=0&&b>=0&&a<N&&b<N&&gitter[b*N+a]!='.'});if(!nb)allein.add(i)}
 // zusammenhängend? (eine Gruppe, damit nach dem Bügeln ein Stück entsteht)
 let teile=0;const ges=new Set();for(let i=0;i<N*N;i++){if(gitter[i]=='.'||ges.has(i))continue;teile++;const st=[i];ges.add(i);
  while(st.length){const j=st.pop(),x=j%N,y=Math.floor(j/N);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const a=x+dx,b=y+dy,k=b*N+a;if(a>=0&&b>=0&&a<N&&b<N&&gitter[k]!='.'&&!ges.has(k)){ges.add(k);st.push(k)}})}}
 return{allein,n,farben:farben.size,teile}}
function pruefKnopf(){geprueft=true;const p=pruefen();zeichne();const fb=$('#fb');
 if(p.n<D.min){fb.className='fb no';fb.innerHTML=`Noch zu klein: mindestens ${D.min} Perlen.`;return}
 if(p.allein.size){fb.className='fb no';fb.innerHTML=`${p.allein.size} Perle${p.allein.size>1?'n':''} ohne Nachbarin an der Seite (blinkt rot). Sie fällt nach dem Bügeln ab.`;return}
 if(p.teile>1){fb.className='fb no';fb.innerHTML=`Dein Bild hat ${p.teile} Teile. Verbinde sie mit Perlen, dann hält es zusammen.`;return}
 if(p.farben>D.maxf){fb.className='fb no';fb.innerHTML=`${p.farben} Farben – höchstens ${D.maxf} Farben.`;return}
 fb.className='fb ok';fb.innerHTML='Super! Jede Perle hat eine Nachbarin. Dein Motiv hält.';
 if(!codeDa){codeDa=true;$('#code').innerHTML=`<div class="code"><p>Dein Codewort:</p><div class="big">${D.code}</div><p>Schreibe es auf dein Entwurfsblatt.</p></div>`}}
function drucken(){const n={};gitter.forEach(c=>{if(c!='.')n[c]=(n[c]||0)+1});
 // Bildausschnitt: nur Zeilen/Spalten mit Perlen
 let x0=N,x1=-1,y0=N,y1=-1;gitter.forEach((c,i)=>{if(c=='.')return;const x=i%N,y=Math.floor(i/N);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
 if(x1<0){$('#fb').className='fb no';$('#fb').textContent='Erst malen, dann drucken.';return}
 const w=x1-x0+1,h=y1-y0+1,mm=Math.min(9,Math.floor(170/Math.max(w,h)));let z='';
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=gitter[y*N+x];z+=c=='.'?'<div style="border-color:transparent"></div>':`<div style="background:${F[c][2]};color:${['K','V','G','R','B'].includes(c)?'#fff':'#222'}">${F[c][3]}</div>`}
