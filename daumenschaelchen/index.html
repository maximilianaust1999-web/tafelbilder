<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daumenschälchen</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--tinte:#0F2B28;--akzent:#EE7B22;--hell:#FCE3CC;--lagune:#9EDFD4;--koralle:#FF8A5B;--butter:#FCEFB4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--hell);color:var(--tinte);font-family:Onest,Arial,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 31vw;grid-template-rows:auto 1fr auto;gap:1.6vw;height:100vh;padding:1.6vw}
header{grid-column:1/3;display:flex;align-items:center;gap:1.4vw}
h1{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:3.2vw;letter-spacing:.05em;line-height:1;padding-top:.4vw}
.punkte{display:flex;gap:.7vw;margin-left:auto}
.punkte button{width:3.4vw;height:3.4vw;border-radius:50%;border:.25vw solid var(--tinte);background:#fff;font:800 1.5vw Onest;color:var(--tinte);cursor:pointer}
.punkte button.ist{background:var(--akzent);color:#fff}.punkte button.war{background:var(--lagune)}
.buehne{position:relative;background:var(--tinte);border-radius:1vw;overflow:hidden;min-height:0}
#yt,#ytf,.buehne iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bilder{position:absolute;inset:0;display:none;grid-template-columns:repeat(3,1fr);gap:1vw;padding:1.4vw;background:#fff}
.bilder img{width:100%;height:100%;object-fit:contain}
.seite{display:flex;flex-direction:column;gap:1.2vw;min-height:0}
.karte{background:#fff;border:.3vw solid var(--tinte);padding:1.6vw;position:relative}
.nr{font-family:'Luckiest Guy';font-size:7vw;line-height:.9;color:var(--akzent)}
.titel{font-weight:800;font-size:2.4vw;line-height:1.15;margin-top:.6vw}
.stich{display:inline-block;background:var(--butter);padding:.5vw 1vw;font-weight:800;font-size:1.7vw;margin-top:1vw;transform:rotate(-1deg)}
.modus{display:flex;align-items:center;gap:1vw;font-weight:800;font-size:1.8vw}
.modus i{display:inline-flex;gap:.3vw;align-items:flex-end;height:2vw}
.modus i b{width:.5vw;background:var(--akzent);height:30%}
.hoer .modus i b{animation:w .6s infinite alternate}.hoer .modus i b:nth-child(2){animation-delay:.2s}.hoer .modus i b:nth-child(3){animation-delay:.4s}
@keyframes w{to{height:100%}}
.text{font-size:2.1vw;line-height:1.35;font-weight:600;flex:1;overflow:hidden}
.text span{transition:color .15s}.text span.an{color:var(--akzent)}.text span.vor{color:#A9B5B3}
footer{grid-column:1/3;display:flex;align-items:center;gap:1.2vw;font-size:1vw;color:#3D4F4C}
footer button{font:800 1.5vw Onest;padding:.7vw 1.6vw;border:.25vw solid var(--tinte);background:var(--akzent);color:#fff;cursor:pointer}
footer button.leise{background:#fff;color:var(--tinte)}
.start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,43,40,.55);z-index:5}
.start button{font-family:'Luckiest Guy';font-size:5vw;padding:1.4vw 4vw 0.8vw;background:var(--koralle);color:#fff;border:.4vw solid var(--tinte);cursor:pointer;box-shadow:.6vw .6vw 0 var(--tinte)}
</style></head><body>
<div class="app" id="app">
<header><h1>Daumenschälchen</h1><div class="punkte" id="punkte"></div></header>
<div class="buehne"><div id="yt"></div><div class="bilder" id="bilder"></div></div>
<div class="seite"><div class="karte"><div class="nr" id="nr"></div><div class="titel" id="titel"></div><div class="stich" id="stich"></div></div>
<div class="modus" id="modus"><i><b></b><b></b><b></b></i><span id="modusText">Bereit</span></div>
<div class="text" id="text"></div></div>
<footer><button id="pause">Pause</button><button class="leise" id="zurueck">◀ Schritt</button><button class="leise" id="weiter">Schritt ▶</button>
<span style="margin-left:auto">Video eingebettet von YouTube: Sabine Krieger, „Ton: Daumenschale“ (Kanal Frau_KriSa) · Tasten: Leertaste Pause, Pfeile Schritt</span></footer>
</div>

  setTimeout(()=>{if(id==laufId&&!pausiert&&player.getPlayerState()!=1)$('modusText').textContent='Tippe aufs Video ▶'},2500);
  uhr=setInterval(()=>{if(id!=laufId||pausiert)return;if(player.getCurrentTime()>=s.bis){clearInterval(uhr);player.pauseVideo();setTimeout(()=>{if(id==laufId)geh(i+1)},700)}},100)}
 if(!s.audio){if(sofort){sofort=false;ton.onended()}else setTimeout(()=>{if(id==laufId)ton.onended()},istBild?0:900)}}   // ohne eigenen Ton: Ausschnitt direkt
function pauseUmschalten(){pausiert=!pausiert;$('pause').textContent=pausiert?'Weiter':'Pause';
 if(phase=='hoer'){pausiert?ton.pause():ton.play()}else if(phase=='schau'){pausiert?player.pauseVideo():player.playVideo()}}
$('start').onclick=()=>{$('start').remove();sofort=!S[0].audio&&bereit;geh(0)};   // iPad: erstes playVideo direkt im Tipp, sonst blockt Safari den Ton
$('pause').onclick=pauseUmschalten;$('weiter').onclick=()=>geh(i+1);$('zurueck').onclick=()=>geh(i-1);
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();pauseUmschalten()}if(e.key=='ArrowRight')geh(i+1);if(e.key=='ArrowLeft')geh(i-1)});
