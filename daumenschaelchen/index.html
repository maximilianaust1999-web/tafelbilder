<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daumenschälchen</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--tinte:#0F2B28;--akzent:#EE7B22;--hell:#FCE3CC;--butter:#FCEFB4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--hell);color:var(--tinte);font-family:Onest,Arial,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;padding:1.4vw 1.6vw;gap:1vw}
h1{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:clamp(22px,3vw,44px);letter-spacing:.05em;line-height:1}
.mitte{flex:1;min-height:0;display:flex;gap:1.4vw;align-items:stretch}
.buehne{flex:1;min-width:0;position:relative;background:var(--tinte);border-radius:1vw;overflow:hidden}
.buehne iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.tipp{width:24vw;align-self:flex-end;background:#fff;border:.3vw solid var(--tinte);padding:1.2vw 1.4vw;display:none}
.tipp .nr{font-family:'Luckiest Guy';font-size:4vw;line-height:.9;color:var(--akzent)}
.tipp .t{font-weight:800;font-size:1.9vw;line-height:1.2;margin-top:.4vw}
footer{font-size:clamp(11px,.95vw,15px);color:#3D4F4C}
</style></head><body>
<div class="app"><h1>Daumenschälchen</h1>
<div class="mitte"><div class="buehne"><div id="yt"></div></div><div class="tipp" id="tipp"><div class="nr" id="nr"></div><div class="t" id="tt"></div></div></div>
<footer>Video eingebettet von YouTube: Sabine Krieger, „Ton: Daumenschale“ (Kanal Frau_KriSa)</footer></div>
<script>
const D={"video": "2gaSD-Ic6fI", "start": 0, "tipps": []};const $=id=>document.getElementById(id);let player;
if(location.protocol=='file:'){   // YouTube braucht eine Herkunft; aus dem Finder geöffnet -> Fehler 153
 $('yt').outerHTML='<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1.2vw;padding:3vw;color:#fff;font:600 1.8vw Onest,Arial"><b>So geht das Video nicht</b><span>Diese Datei wurde direkt aus dem Ordner geöffnet. Öffne sie über die iPad-App oder das GitHub-Tafelbild.</span><a style="color:#9EDFD4" target="_blank" href="https://www.youtube.com/watch?v='+D.video+'">Video direkt auf YouTube öffnen</a></div>';
}else{
 const f=document.createElement('iframe');f.referrerPolicy='strict-origin-when-cross-origin';f.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';f.allowFullscreen=true;f.id='ytf';
 f.src='https://www.youtube-nocookie.com/embed/'+D.video+'?enablejsapi=1&rel=0&playsinline=1&iv_load_policy=3&start='+Math.floor(D.start)+'&origin='+encodeURIComponent(location.origin);
 $('yt').replaceWith(f);
 if(D.tipps.length){$('tipp').style.display='block';const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);
  window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('ytf');setInterval(()=>{if(!player.getCurrentTime)return;const z=player.getCurrentTime();
   let a=null;D.tipps.forEach((x,k)=>{if(z>=x.ab)a=[k,x]});$('nr').textContent=a?(a[1].nr||a[0]+1):'';$('tt').textContent=a?a[1].text:'Schau genau zu.'},300)}}
}
</script></body></html>
